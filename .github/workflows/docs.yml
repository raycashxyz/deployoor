name: Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "pnpm-lock.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The docs contain `ts twoslash` blocks importing `deployoor`, and twoslash
      # type-checks them against its built .d.ts — so build the package first.
      # Same reason apps/docs/vercel.json builds it before running vocs.
      - run: pnpm --filter deployoor build
      - run: pnpm --filter @deployoor/docs build
