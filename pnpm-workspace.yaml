packages:
  - packages/*
  - apps/*
  - examples/*
  - evals

catalog:
  '@types/node': ^22.15.3
  '@wagmi/cli': ^2.3.1
  effect: 3.21.4
  typescript: ^5.9.3
  viem: 2.46.0
  vitest: ^4.0.17

onlyBuiltDependencies:
  - esbuild
  # evalite stores eval history in SQLite, so its better-sqlite3 needs its native build to run.
  # pnpm skips build scripts unless the package is listed here, and the failure is a require-time
  # "Could not locate the bindings file" from `evalite`, not an install error.
  - better-sqlite3

overrides:
  es-module-lexer: 2.3.0

packageExtensions:
  '@tevm/solc':
    dependencies:
      solc: '>=0.8.0 <0.9.0'
