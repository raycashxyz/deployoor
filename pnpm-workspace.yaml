packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"

# Self-contained catalog (no external monorepo dependency).
catalog:
  "@types/node": ^22.15.3
  "@wagmi/cli": ^2.3.1
  effect: ^3.19.0
  typescript: ^5.9.3
  viem: 2.57.4
  vitest: ^4.0.17

onlyBuiltDependencies:
  - esbuild

# Overrides live here, not in package.json's `pnpm` block: when both exist the
# package.json one wins silently and this file is ignored with no warning.
overrides:
  es-module-lexer: 2.3.0
